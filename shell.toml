# Felix for Omarchy Quattro's Quickshell shell.
#
# OMARCHY 3 STYLE PORT MAP
# ------------------------
# [bar], [controls], and [tooltip] preserve waybar.css.
# [notifications] preserves mako.ini.
# [launcher] and [menu] preserve walker.css.
# [popups] preserves swayosd.css.
# [lock] preserves hyprlock.conf.
#
# Quickshell does not expose every old GTK selector, so component-specific
# details are represented with the closest supported shared surface tokens.

# Ported from waybar.css: edge-to-edge black, bold-looking high-contrast text,
# and a thin light selected-state underline.
[bar]
background = "#000000"
background-alpha = 1.0
text = "#e7e9ea"
active = "#ff8852"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "#878787"
active-border-foreground = "#e7e9ea"

# Ported from Waybar's active underline and Walker's #121212 search field.
[controls]
normal-color = "#121212"
normal-fill-alpha = 1.0
normal-border = "#626262"
normal-border-width = 1
normal-border-alpha = 0.6
hover-cursor-color = "#e7e9ea"
hover-cursor-fill-alpha = 0.08
hover-cursor-border = "#e7e9ea"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.7
focus-color = "#e7e9ea"
focus-fill-alpha = 0.08
focus-border = "#e7e9ea"
focus-border-width = 1
focus-border-alpha = 1.0
selected-color = "#e7e9ea"
selected-fill-alpha = 0.12
selected-border = "#e7e9ea"
selected-border-width = "0 0 1 0"
selected-border-alpha = 1.0
pressed-fill-alpha = 0.18
selection-fill-alpha = 0.28

[spacing]
scale = 1.0
scale-with-font = true

# Mako used an 11px JetBrains Mono face. Quattro owns the family globally.
[font]
base-size = 11

# Ported from swayosd.css: black card, white content, thin white frame. OSD
# progress uses Felix's orange Quattro accent because there is no per-OSD token.
[popups]
background = "#000000"
background-alpha = 1.0
text = "#e7e9ea"
border = "#e7e9ea"
border-alpha = 1.0
border-width = 1

# Ported from Waybar's monochrome tooltip language.
[tooltip]
background = "#000000"
background-alpha = 0.97
text = "#e7e9ea"
border = "#e7e9ea"
border-alpha = 1.0
border-width = 1

# Ported from mako.ini: black, white, compact, and outlined by one clean pixel.
[notifications]
background = "#000000"
background-alpha = 1.0
text = "#e7e9ea"
border = "#e7e9ea"
border-alpha = 1.0
border-width = 1
countdown = "#ff8852"

# Ported from walker.css: 80% black scrim, black card, #121212 controls, a thin
# white frame, muted list text, and restrained selected-row contrast.
[launcher]
background = "#000000"
background-alpha = 1.0
text = "#71767b"
border = "#e7e9ea"
border-alpha = 1.0
border-width = 1
scrim = "#000000"
scrim-alpha = 0.80
selected-background = "#e7e9ea"
selected-background-alpha = 0.12
selected-text = "#e7e9ea"
selected-border = "#e7e9ea"
selected-border-alpha = 0.5
selected-border-width = 1

# Ported from Walker's install/app/theme menus; clipboard and emoji inherit it.
[menu]
background = "#000000"
background-alpha = 1.0
text = "#71767b"
border = "#e7e9ea"
border-alpha = 1.0
border-width = 1
scrim = "#000000"
scrim-alpha = 0.80
selected-background = "#e7e9ea"
selected-background-alpha = 0.12
selected-text = "#e7e9ea"
selected-border = "#e7e9ea"
selected-border-alpha = 0.5
selected-border-width = 1

[polkit]
background = "#000000"
background-alpha = 1.0
text = "#e7e9ea"
text-error = "#ff8852"
border = "#e7e9ea"
border-error = "#ff8852"
border-alpha = 1.0
scrim = "#000000"
scrim-alpha = 0.80
accent = "#ff8852"

# Ported from hyprlock.conf: opaque black input and monochrome white state.
[lock]
background = "#000000"
background-alpha = 1.0
text = "#e7e9ea"
placeholder = "#9e9e9e"
text-error = "#ff8852"
border = "#e7e9ea"
border-active = "#e7e9ea"
border-error = "#ff8852"
border-alpha = 1.0
selection = "#e7e9ea"
selection-alpha = 0.35

[image-picker]
scrim = "#000000"
scrim-alpha = 0.80
text = "#e7e9ea"
selected-border = "#ff8852"
selected-border-alpha = 1.0
unselected-border = "#e7e9ea"
unselected-border-alpha = 0.28
